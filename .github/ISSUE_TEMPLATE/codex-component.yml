name: Codex-Ready Component Work
description: Create a primitive or composite issue that is ready for Codex to turn into a draft pull request.
title: "Build Luna... "
labels:
  - feature
body:
  - type: dropdown
    id: level
    attributes:
      label: Component Level
      description: Choose the system level for this work.
      options:
        - primitive
        - composite
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why This Exists
      description: Describe the user-facing or system-level need.
      placeholder: Explain why this component belongs in the library.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Contract Expectations
      description: Describe the public contract, states, or important boundaries.
      placeholder: |
        - prop and slot expectations
        - state and variant expectations
        - theming expectations
        - non-goals or exclusions
    validations:
      required: true

  - type: textarea
    id: outputs
    attributes:
      label: Required Outputs
      description: State what should be included in the completed change.
      value: |
        - implementation
        - Storybook coverage
        - tests
        - docs
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done Looks Like
      description: State the observable acceptance criteria.
      placeholder: What should be true when this issue is ready for review?
    validations:
      required: true

  - type: dropdown
    id: automation
    attributes:
      label: Automation Readiness
      description: Decide whether this issue should be eligible for Codex automation.
      options:
        - Not ready yet
        - Ready for codex-ready label
    validations:
      required: true
